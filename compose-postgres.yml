version: '3.8'

services:
  postgresql:
    image: postgres:18-alpine
    container_name: postgresql-iot
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iot-network
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      
networks:
  iot-network:
    external: true

volumes:
  postgres-data:
